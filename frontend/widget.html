<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matt's Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --surface: #f4f4f4; --border: #e0e0e0;
      --text: #1a1a1a; --text-muted: #888; --btn: #1a1a1a; --btn-text: #ffffff;
      --user-bubble: #1a1a1a; --bot-bubble: #f4f4f4; --font: 'Raleway', sans-serif;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
    .shell { display: flex; flex-direction: column; height: 100vh; max-width: 640px; margin: 0 auto; }
    .header { padding: 20px 24px; border-bottom: 1px solid var(--border); }
    .header-title { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
    .header-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; font-weight: 300; }
    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .msg { display: flex; flex-direction: column; gap: 3px; animation: fadeUp 0.18s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .msg-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); font-weight: 500; }
    .msg.user { align-items: flex-end; }
    .msg.user .msg-label { text-align: right; }
    .bubble { padding: 11px 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; max-width: 78%; }
    .msg.bot .bubble { background: var(--bot-bubble); color: var(--text); max-width: 88%; }
    .typing .bubble { display: flex; gap: 5px; align-items: center; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: blink 1.2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
    .suggestions { padding: 0 24px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .suggestion { font-family: var(--font); font-size: 11px; font-weight: 500; letter-spacing: 0.05em; padding: 6px 13px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.15s ease; text-transform: uppercase; }
    .suggestion:hover { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
    .input-row { padding: 12px 24px 20px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
    input[type="text"] { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--font); font-size: 13px; padding: 10px 14px; outline: none; transition: border-color 0.15s; }
    input[type="text"]:focus { border-color: var(--text); }
    input[type="text"]::placeholder { color: var(--text-muted); font-weight: 300; }
    button.send { background: var(--btn); color: var(--btn-text); border: none; padding: 0 22px; font-family: var(--font); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: opacity 0.15s; }
    button.send:hover { opacity: 0.75; }
    button.send:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="header-title">Matthew Zhang — Assistant</div>
    <div class="header-sub">Ask me anything about Matt's work and experience</div>
  </div>
  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="msg-label">Assistant</div>
      <div class="bubble">Hi! I'm Matt's portfolio assistant. Feel free to ask me about his experience, projects, or skills.</div>
    </div>
  </div>
  <div class="suggestions" id="suggestions">
    <button class="suggestion" onclick="suggest(this)">What has Matt built?</button>
    <button class="suggestion" onclick="suggest(this)">Games experience?</button>
    <button class="suggestion" onclick="suggest(this)">Tech stack?</button>
    <button class="suggestion" onclick="suggest(this)">Open to work?</button>
  </div>
  <div class="input-row">
    <input type="text" id="input" placeholder="Ask something..." autocomplete="off"/>
    <button class="send" id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>
<script>
  const API_URL = "http://127.0.0.1:8000/chat";
  let history = [], isLoading = false;
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const suggestionsEl = document.getElementById("suggestions");

  inputEl.addEventListener("keydown", e => { if (e.key === "Enter" && !isLoading) sendMessage(); });

  function suggest(btn) { inputEl.value = btn.textContent; suggestionsEl.style.display = "none"; sendMessage(); }

  function addMessage(role, text) {
    const msg = document.createElement("div");
    msg.className = "msg " + role;
    msg.innerHTML = '<div class="msg-label">' + (role === "user" ? "You" : "Assistant") + '</div><div class="bubble">' + text + '</div>';
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const msg = document.createElement("div");
    msg.className = "msg bot typing"; msg.id = "typing";
    msg.innerHTML = '<div class="msg-label">Assistant</div><div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() { const t = document.getElementById("typing"); if (t) t.remove(); }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;
    suggestionsEl.style.display = "none";
    isLoading = true; sendBtn.disabled = true; inputEl.value = "";
    addMessage("user", text);
    showTyping();
    try {
      const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, history }) });
      const data = await res.json();
      removeTyping();
      addMessage("bot", data.response);
      history.push(text);
    } catch (err) {
      removeTyping();
      addMessage("bot", "Sorry, I couldn't connect to the server. Make sure the backend is running.");
    }
    isLoading = false; sendBtn.disabled = false; inputEl.focus();
  }
</script>
</body>
</html>
